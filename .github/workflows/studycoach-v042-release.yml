name: Study Coach v0.4.2 validated release
on:
  pull_request:
  push:
    branches:
      - release/v0.4.2
    paths:
      - .release/v0.4.2.trigger

permissions:
  contents: read

concurrency:
  group: study-coach-v0.4.2-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests for editor and judge
        shell: pwsh
        run: |
          python -m unittest -q test_editor_starter test_progression test_source_progress test_public_release
          if ($LASTEXITCODE -ne 0) { throw 'Python regressions failed' }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed' }
          node scripts/test_editor_drafts.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Editor draft migration regressions failed' }
      - name: Ensure installer advertises 0.4.2
        shell: pwsh
        run: |
          if ((Get-Content 'packaging/windows/StudyCoach.iss' -Raw) -notmatch '#define AppVersion "0\.4\.2"') {
            throw 'Installer version is not 0.4.2'
          }
      - name: Install MSYS2 UCRT64 toolchain
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build portable program
        shell: pwsh
        env:
          STUDY_COACH_MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        run: ./packaging/windows/build-portable.ps1
      - name: Smoke test packaged server and auto judge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/StudyCoach-Windows-Portable').Path
          & "$folder/runtime/python.exe" -c "import sys;sys.path.insert(0,r'$folder');from judge_packs import approved_problem;assert len([i for i in range(31,301) if approved_problem(i)])==270;print('PACKS_OK=270')"
          if ($LASTEXITCODE -ne 0) { throw 'Packed judge verification failed' }
          $env:PATH = "$folder/toolchain/bin;" + $env:PATH
          $env:STUDY_COACH_GPP = "$folder/toolchain/bin/g++.exe"
          $env:STUDY_COACH_PORT = '8791'
          $child = Start-Process -FilePath "$folder/runtime/python.exe" -ArgumentList ('"' + "$folder/server.py" + '"') -WorkingDirectory $folder -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 350
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:8791/api/health' -TimeoutSec 1
                if ($response.ok) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw 'Packaged server health check failed' }
            $dashboard = Invoke-RestMethod 'http://127.0.0.1:8791/api/dashboard'
            if (@($dashboard.exercises | Where-Object auto_judge).Count -ne 300) { throw '300 exercises expected' }
          } finally {
            Stop-Process -Id $child.Id -ErrorAction SilentlyContinue
          }
      - name: Archive portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/StudyCoach-Windows-Portable' -DestinationPath 'dist/StudyCoach-Windows-Portable.zip' -CompressionLevel Optimal
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\StudyCoach.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
      - name: Check Defender and scan final distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) { throw 'Defender unavailable' }
          $status = Get-MpComputerStatus
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) { throw 'Defender engine disabled' }
          if (-not $status.AntivirusSignatureLastUpdated -or ((Get-Date) - [datetime]$status.AntivirusSignatureLastUpdated).TotalDays -gt 7) { throw 'Defender signatures outdated' }
          $start = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path 'dist').Path -ErrorAction Stop
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object { $_.InitialDetectionTime -ge $start.AddSeconds(-3) })
          if ($detections.Count -gt 0) { throw "Defender detected $($detections.Count) new threats" }
          Write-Output "DEFENDER_SCAN_OK=$($status.AntivirusSignatureVersion)"
      - name: Create SHA-256 manifest and verify both assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('StudyCoach-Windows-Setup.exe', 'StudyCoach-Windows-Portable.zip')
          $lines = foreach ($name in $names) {
            $path = Join-Path 'dist' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing asset: $name" }
            $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $name"
          }
          $manifest = Join-Path (Resolve-Path 'dist').Path 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($manifest, (($lines -join "\n") + "\n"), [Text.Encoding]::ASCII)
          if ((Get-Content -LiteralPath $manifest).Count -ne 2) { throw 'Checksum manifest must contain two entries' }
          Write-Output 'SHA256SUMS_CREATED=2'
      - name: Upload validated release files
        uses: actions/upload-artifact@v4
        with:
          name: studycoach-v0.4.2-validated
          if-no-files-found: error
          path: |
            dist/StudyCoach-Windows-Setup.exe
            dist/StudyCoach-Windows-Portable.zip
            dist/SHA256SUMS.txt

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.4.2'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an already published tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.2; then
            echo "Tag v0.4.2 already exists; refusing to overwrite a public release"
            exit 1
          fi
          if gh release view v0.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.4.2 already exists; refusing to overwrite"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: studycoach-v0.4.2-validated
          path: dist
      - name: Independently verify downloaded SHA-256 hashes
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish Study Coach v0.4.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          target_commitish: ${{ github.sha }}
          name: "Study Coach v0.4.2 - Editor spacing fix"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ## Changes
            - Fixed excessive blank lines in the C++ code starter.
            - Corrected previously untouched editor drafts without overwriting user-edited C++ code.
            - Installer version now shows 0.4.2.

            ## Windows downloads
            - Setup: StudyCoach-Windows-Setup.exe (double-click to install).
            - Portable: StudyCoach-Windows-Portable.zip (extract all, run StudyCoach.exe).
            - Verify downloads using SHA256SUMS.txt in this release.

            Both packages bundle Python and the C++ toolchain. User progress is stored locally.
            
            **Security notice:** These installers are not Authenticode signed. Microsoft Defender SmartScreen can warn about an unknown publisher. Verify the download origin and SHA-256 digest; do not disable SmartScreen or Defender.
          files: |
            dist/StudyCoach-Windows-Setup.exe
            dist/StudyCoach-Windows-Portable.zip
            dist/SHA256SUMS.txt
