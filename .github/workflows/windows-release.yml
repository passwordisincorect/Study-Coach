name: Build Windows portable and installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build portable folder
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1
      - name: Verify packaged runtime and Auto Judge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/StudyCoach-Windows-Portable').Path
          & "$folder/runtime/python.exe" -c "import sys;sys.path.insert(0,r'$folder');from judge_packs import approved_problem;assert len([i for i in range(31,301) if approved_problem(i)])==270;print('PACKS_OK=270')"
          if ($LASTEXITCODE -ne 0) { throw 'Packed judge failed' }
          $env:PATH = "$folder/toolchain/bin;" + $env:PATH
          $env:STUDY_COACH_GPP = "$folder/toolchain/bin/g++.exe"
          $env:STUDY_COACH_PORT = '8791'
          $child = Start-Process -FilePath "$folder/runtime/python.exe" -ArgumentList "`"$folder/server.py`"" -WorkingDirectory $folder -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 350
              try { $response = Invoke-RestMethod 'http://127.0.0.1:8791/api/health' -TimeoutSec 1; if ($response.ok) { $healthy = $true; break } } catch {}
            }
            if (-not $healthy) { throw 'Portable server failed' }
            $dashboard = Invoke-RestMethod 'http://127.0.0.1:8791/api/dashboard'
            if (@($dashboard.exercises | Where-Object auto_judge).Count -ne 300) { throw 'Missing judge packs' }
          } finally {
            Stop-Process -Id $child.Id -ErrorAction SilentlyContinue
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/StudyCoach-Windows-Portable' -DestinationPath 'dist/StudyCoach-Windows-Portable.zip' -CompressionLevel Optimal
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\StudyCoach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyCoach-Windows
          path: |
            dist/StudyCoach-Windows-Portable.zip
            dist/StudyCoach-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/StudyCoach-Windows-Portable.zip
            dist/StudyCoach-Windows-Setup.exe
