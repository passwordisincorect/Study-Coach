name: Build and verify Windows release
on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SHA-256 checksum creation, verification and tamper rejection
        shell: pwsh
        run: ./packaging/windows/test-release-checksums.ps1
      - name: Run application regression tests
        shell: pwsh
        run: python -m unittest -q test_progression test_source_progress test_public_release
      - name: Install GCC (MSYS2 UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build portable folder
        env:
          STUDY_COACH_MSYS2: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: ./packaging/windows/build-portable.ps1
      - name: Verify packaged runtime and Auto Judge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = (Resolve-Path 'dist/StudyCoach-Windows-Portable').Path
          & "$folder/runtime/python.exe" -c "import sys;sys.path.insert(0,r'$folder');from judge_packs import approved_problem;assert len([i for i in range(31,301) if approved_problem(i)])==270;print('PACKS_OK=270')"
          if ($LASTEXITCODE -ne 0) { throw 'Packed judge failed' }
          $env:PATH = "$folder/toolchain/bin;" + $env:PATH
          $env:STUDY_COACH_GPP = "$folder/toolchain/bin/g++.exe"
          $env:STUDY_COACH_PORT = '8791'
          $child = Start-Process -FilePath "$folder/runtime/python.exe" -ArgumentList "`"$folder/server.py`"" -WorkingDirectory $folder -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 350
              try { $response = Invoke-RestMethod 'http://127.0.0.1:8791/api/health' -TimeoutSec 1; if ($response.ok) { $healthy = $true; break } } catch {}
            }
            if (-not $healthy) { throw 'Portable server failed' }
            $dashboard = Invoke-RestMethod 'http://127.0.0.1:8791/api/dashboard'
            if (@($dashboard.exercises | Where-Object auto_judge).Count -ne 300) { throw 'Missing judge packs' }
          } finally {
            Stop-Process -Id $child.Id -ErrorAction SilentlyContinue
          }
      - name: Sign launcher before packaging (mandatory for tags)
        env:
          STUDY_COACH_SIGNING_PFX_BASE64: ${{ secrets.STUDY_COACH_SIGNING_PFX_BASE64 }}
          STUDY_COACH_SIGNING_PFX_PASSWORD: ${{ secrets.STUDY_COACH_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $release = $env:GITHUB_REF -like 'refs/tags/v*'
          ./packaging/windows/sign-release.ps1 -Files @('dist/StudyCoach-Windows-Portable/StudyCoach.exe') -RequireSigning:$release
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/StudyCoach-Windows-Portable' -DestinationPath 'dist/StudyCoach-Windows-Portable.zip' -CompressionLevel Optimal
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer EXE
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "packaging\windows\StudyCoach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer (mandatory for tags)
        env:
          STUDY_COACH_SIGNING_PFX_BASE64: ${{ secrets.STUDY_COACH_SIGNING_PFX_BASE64 }}
          STUDY_COACH_SIGNING_PFX_PASSWORD: ${{ secrets.STUDY_COACH_SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $release = $env:GITHUB_REF -like 'refs/tags/v*'
          ./packaging/windows/sign-release.ps1 -Files @('dist/StudyCoach-Windows-Setup.exe') -RequireSigning:$release
      - name: Verify public release signatures
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($file in @('dist/StudyCoach-Windows-Portable/StudyCoach.exe', 'dist/StudyCoach-Windows-Setup.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) { throw "Invalid or untimestamped signature: $file" }
          }
      - name: Scan final distribution with Microsoft Defender
        shell: pwsh
        run: |
          $release = $env:GITHUB_REF -like 'refs/tags/v*'
          ./packaging/windows/scan-defender.ps1 -ScanPath 'dist' -RequireDefender:$release
      - name: Create and verify public SHA-256 checksums
        shell: pwsh
        run: |
          ./packaging/windows/release-checksums.ps1 -Mode Create -DistDir 'dist'
          ./packaging/windows/release-checksums.ps1 -Mode Verify -DistDir 'dist'
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StudyCoach-Windows
          path: |
            dist/StudyCoach-Windows-Portable.zip
            dist/StudyCoach-Windows-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: StudyCoach-Windows
          path: dist
      - name: Publish signed release with checksums
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/StudyCoach-Windows-Portable.zip
            dist/StudyCoach-Windows-Setup.exe
            dist/SHA256SUMS.txt
